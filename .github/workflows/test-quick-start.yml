name: test-quick-start

# Run the Ascend Quick Start end-to-end test on a real NPU runner.
#
# Triggered by ``monitor-upstream`` whenever it detects a change in:
#   * the monitored doc (reason=doc)   → tests upstream main
#   * the upstream latest release (reason=release) → tests that tag
#   * the upstream main tip (reason=commit) → tests upstream main
#
# The test always checks out **upstream** ``modelscope/ms-swift`` (or
# whatever ``vars.UPSTREAM_REPO`` is set to) and overlays the
# ``tests/docs/`` from this fork onto the upstream checkout, so the
# test code under review lives here but the system-under-test is
# always the upstream tree at the requested ref.

on:
  repository_dispatch:
    types: [quick-start-updated]
  workflow_dispatch:
    inputs:
      reason:
        description: 'test reason (free-form label, e.g. doc/release/commit/manual)'
        required: false
        default: 'manual'
      ref:
        description: 'upstream ref to check out (branch or tag)'
        required: false
        default: 'main'

permissions:
  contents: read

env:
  UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO || 'modelscope/ms-swift' }}
  REASON: ${{ github.event.client_payload.reason || inputs.reason || 'manual' }}
  REF: ${{ github.event.client_payload.ref || inputs.ref || 'main' }}
  UV_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
  UV_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi"
  UV_INDEX_STRATEGY: "unsafe-best-match"
  UV_INSECURE_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"
  UV_HTTP_TIMEOUT: "120"
  UV_NO_CACHE: "1"
  UV_SYSTEM_PYTHON: "1"
  PIP_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
  PIP_TRUSTED_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"

jobs:
  test:
    name: test-quick-start (${{ env.REASON }}/${{ env.REF }})
    runs-on: [linux-aarch64-a2-1]
    timeout-minutes: 240
    container:
      image: 'swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:8.3.rc2-910b-ubuntu22.04-py3.11'
      options: >-
        --privileged
        --device=/dev/davinci0
        --device=/dev/davinci1
        --device=/dev/davinci2
        --device=/dev/davinci3
        --device=/dev/davinci_manager
        --device=/dev/devmm_svm
        --device=/dev/hisi_hdc
        --volume=/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        --volume=/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
        --volume=/etc/ascend_install.info:/etc/ascend_install.info:ro
    env:
      SWIFT_NPU_E2E: '1'
      UPSTREAM_REF: ${{ env.REF }}
    steps:
      - name: 打印测试上下文
        run: |
          echo "=========================================="
          echo "Trigger:        ${{ github.event_name }}"
          echo "Reason:         ${{ env.REASON }}"
          echo "Upstream ref:   ${{ env.REF }}"
          echo "Upstream repo:  ${{ env.UPSTREAM_REPO }}"
          echo "=========================================="

      - name: Config mirrors
        run: |
          sed -Ei 's@(ports|archive).ubuntu.com@cache-service.nginx-pypi-cache.svc.cluster.local:8081@g' /etc/apt/sources.list
          pip config set global.index-url http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
          pip config set global.trusted-host cache-service.nginx-pypi-cache.svc.cluster.local

      - name: Resolve upstream commit SHA
        id: upstream-commit
        # When ``REF`` is a tag, resolve it to the actual commit so the
        # test pins to a specific SHA. When it's a branch (``main``),
        # just record the current HEAD — the test will install by
        # commit SHA anyway, so the recorded value reflects what was
        # actually tested.
        run: |
          SHA=$(curl -fsSL "${{ env.GH_API }}/repos/${{ env.UPSTREAM_REPO }}/commits/${{ env.REF }}" \
            | jq -r '.sha // empty')
          if [ -z "$SHA" ]; then
            echo "::error::failed to resolve ${{ env.REF }} to a commit"
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Upstream commit: $SHA"

      - name: 跑 quick start 测试
        id: test
        env:
          SWIFT_NPU_E2E: '1'
          UPSTREAM_REPO: ${{ env.UPSTREAM_REPO }}
          UPSTREAM_REF: ${{ env.REF }}
          UPSTREAM_COMMIT: ${{ steps.upstream-commit.outputs.sha }}
          REASON: ${{ env.REASON }}
        run: |
          python -m unittest tests.docs.test_quick_start_ascend -v 2>&1 | tee /tmp/unittest.log

      - name: 汇总测试结果
        if: always()
        env:
          UPSTREAM_COMMIT: ${{ steps.upstream-commit.outputs.sha }}
        run: |
          echo "============================================================"
          echo "QUICK START TEST SUMMARY"
          echo "  Upstream repo:    ${{ env.UPSTREAM_REPO }}"
          echo "  Upstream ref:     ${{ env.REF }}"
          echo "  Upstream commit:  ${{ steps.upstream-commit.outputs.sha }}"
          echo "  Trigger reason:   ${{ env.REASON }}"
          echo "------------------------------------------------------------"
          if [ -f /tmp/unittest.log ]; then
            grep -E '^Ran [0-9]+ test' /tmp/unittest.log | tail -n 1 || true
            grep -E '^(OK|FAILED)' /tmp/unittest.log | tail -n 1 || true
          fi
          echo "============================================================"
        run: |
          echo "============================================================"
          echo "QUICK START TEST SUMMARY"
          echo "  Upstream repo:    ${{ env.UPSTREAM_REPO }}"
          echo "  Upstream ref:     ${{ env.REF }}"
          echo "  Upstream commit:  ${{ steps.upstream-commit.outputs.sha }}"
          echo "  Trigger reason:   ${{ env.REASON }}"
          echo "------------------------------------------------------------"
          if [ -f /tmp/unittest.log ]; then
            grep -E '^Ran [0-9]+ test' /tmp/unittest.log | tail -n 1 || true
            grep -E '^(OK|FAILED)' /tmp/unittest.log | tail -n 1 || true
          fi
          echo "============================================================"
