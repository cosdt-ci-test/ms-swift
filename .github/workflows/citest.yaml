name: citest

# Disabled on 2026-08-14.
# Replaced by .github/workflows/quick-start-ascend-ci.yml (NPU) and the
# standard CI on the upstream repo. Keep this file so that any external
# branch-protection / required-check references still resolve to a real
# workflow, but the trigger list is empty so it never runs.

on: []

concurrency:
  group: citest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: [self-hosted]
    if: ${{ false }}
    steps:
      - run: echo "citest is disabled"
