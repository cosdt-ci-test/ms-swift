name: monitor-upstream

# This workflow is the upstream watcher. It runs three lightweight
# jobs on a regular schedule and dispatches ``test-quick-start``
# whenever it detects a change. The fork repo is the *runner*; the
# actual code and docs being tested live in upstream
# ``modelscope/ms-swift`` (configurable via ``vars.UPSTREAM_REPO``).
#
#   * ``monitor-doc``       — every hour, hash a configurable
#                             ``MONITORED_DOC_URL`` (defaults to the
#                             Quick Start in upstream main).
#   * ``monitor-release``   — every hour, hash the upstream latest
#                             release's commit SHA.
#   * ``daily-test-trigger``— once a day, hash the upstream ``main``
#                             branch tip.
#
# The job ``if`` expressions are matched against the cron that fired
# the workflow, so each schedule only runs the job it owns.

on:
  schedule:
    # Every hour, on the half hour: doc + release monitor.
    - cron: '30 * * * *'
    # 01:00 UTC every day: daily upstream-main commit monitor.
    - cron: '0 1 * * *'

permissions:
  contents: write

env:
  UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO || 'modelscope/ms-swift' }}
  MONITORED_DOC_URL: ${{ vars.MONITORED_DOC_URL || format('https://raw.githubusercontent.com/{0}/main/docs/source/GetStarted/Quick-start-Ascend.md', vars.UPSTREAM_REPO || 'modelscope/ms-swift') }}
  GH_API: https://api.github.com

jobs:
  # ---------------------------------------------------------------- #
  # 1.  Hash the monitored doc every hour.                          #
  # ---------------------------------------------------------------- #
  monitor-doc:
    name: monitor-doc
    if: github.event.schedule == '30 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fetch + hash doc
        id: check
        env:
          DOC_URL: ${{ env.MONITORED_DOC_URL }}
        run: |
          set -euo pipefail
          echo "Monitoring: $DOC_URL"
          curl -fsSL --retry 3 "$DOC_URL" -o /tmp/external.md
          NEW_HASH=$(sha256sum /tmp/external.md | cut -d' ' -f1)
          OLD_HASH=$(cat .doc_hash 2>/dev/null || echo "")
          echo "old: $OLD_HASH"
          echo "new: $NEW_HASH"
          if [ "$OLD_HASH" != "$NEW_HASH" ]; then
            echo "$NEW_HASH" > .doc_hash
            echo "CHANGED=true" >> "$GITHUB_OUTPUT"
          else
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated hash
        if: steps.check.outputs.CHANGED == 'true'
        run: |
          git config user.email "ci@example.com"
          git config user.name "doc-monitor"
          git add .doc_hash
          git commit -m "chore(monitor): bump monitored doc hash [skip ci]"
          git push

      - name: Dispatch test
        if: steps.check.outputs.CHANGED == 'true'
        env:
          TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GH_API/repos/${{ github.repository }}/dispatches" \
            -d '{
              "event_type": "quick-start-updated",
              "client_payload": {
                "reason": "doc",
                "ref": "main"
              }
            }'

  # ---------------------------------------------------------------- #
  # 2.  Hash the upstream latest release every hour.                #
  # ---------------------------------------------------------------- #
  monitor-release:
    name: monitor-release
    if: github.event.schedule == '30 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fetch upstream latest release
        id: check
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            "$GH_API/repos/${{ env.UPSTREAM_REPO }}/releases/latest" \
            -o /tmp/release.json
          TAG=$(jq -r '.tag_name // empty' /tmp/release.json)
          SHA=$(jq -r '.target_commitish // empty' /tmp/release.json)
          OLD_SHA=$(cat .last_release_sha 2>/dev/null || echo "")
          echo "tag:    $TAG"
          echo "sha:    $SHA"
          echo "old:    $OLD_SHA"
          if [ -z "$TAG" ] || [ -z "$SHA" ]; then
            echo "no upstream release yet — skipping"
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
            echo "TAG=" >> "$GITHUB_OUTPUT"
            echo "SHA=" >> "$GITHUB_OUTPUT"
          elif [ "$OLD_SHA" != "$SHA" ]; then
            echo "$SHA" > .last_release_sha
            echo "CHANGED=true" >> "$GITHUB_OUTPUT"
            echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
            echo "SHA=$SHA" >> "$GITHUB_OUTPUT"
          else
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
            echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
            echo "SHA=$SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated release sha
        if: steps.check.outputs.CHANGED == 'true'
        run: |
          git config user.email "ci@example.com"
          git config user.name "doc-monitor"
          git add .last_release_sha
          git commit -m "chore(monitor): bump upstream release sha to ${{ steps.check.outputs.TAG }} [skip ci]"
          git push

      - name: Dispatch test
        if: steps.check.outputs.CHANGED == 'true'
        env:
          TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
        run: |
          TAG="${{ steps.check.outputs.TAG }}"
          curl -fsSL -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GH_API/repos/${{ github.repository }}/dispatches" \
            -d "{
              \"event_type\": \"quick-start-updated\",
              \"client_payload\": {
                \"reason\": \"release\",
                \"ref\": \"$TAG\"
              }
            }"

  # ---------------------------------------------------------------- #
  # 3.  Daily: check upstream main for a new commit.                 #
  # ---------------------------------------------------------------- #
  daily-test-trigger:
    name: daily-test-trigger
    if: github.event.schedule == '0 1 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Compare upstream main HEAD
        id: check
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            "$GH_API/repos/${{ env.UPSTREAM_REPO }}/commits/main" \
            -o /tmp/commit.json
          CURRENT_SHA=$(jq -r '.sha // empty' /tmp/commit.json)
          OLD_SHA=$(cat .last_tested_sha 2>/dev/null || echo "")
          echo "current: $CURRENT_SHA"
          echo "old:     $OLD_SHA"
          if [ -z "$CURRENT_SHA" ]; then
            echo "no upstream commit available — skipping"
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
          elif [ "$OLD_SHA" != "$CURRENT_SHA" ]; then
            echo "$CURRENT_SHA" > .last_tested_sha
            echo "CHANGED=true" >> "$GITHUB_OUTPUT"
            echo "SHA=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "CHANGED=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated tested sha
        if: steps.check.outputs.CHANGED == 'true'
        run: |
          git config user.email "ci@example.com"
          git config user.name "doc-monitor"
          git add .last_tested_sha
          git commit -m "chore(monitor): bump last-tested upstream commit to ${{ steps.check.outputs.SHA }} [skip ci]"
          git push

      - name: Dispatch test
        if: steps.check.outputs.CHANGED == 'true'
        env:
          TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GH_API/repos/${{ github.repository }}/dispatches" \
            -d '{
              "event_type": "quick-start-updated",
              "client_payload": {
                "reason": "commit",
                "ref": "main"
              }
            }'
