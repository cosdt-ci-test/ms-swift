name: notify-example-guard-release

on:
  push:
    tags:
      - 'v**'

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch ms-swift-release
        env:
          TOKEN: ${{ secrets.EXAMPLE_GUARD_PAT }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "EXAMPLE_GUARD_PAT is not configured"
            exit 1
          fi
          payload="$(jq -n \
            --arg tag "$TAG" \
            --arg sha "$SHA" \
            '{
              event_type: "ms-swift-release",
              client_payload: {
                repo: "cosdt-ci-test/ms-swift",
                ref: $tag,
                sha: $sha
              }
            }')"
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/cosdt-ci-test/workflows/dispatches \
            -d "$payload"
          echo "dispatched ms-swift-release for $TAG ($SHA)"
