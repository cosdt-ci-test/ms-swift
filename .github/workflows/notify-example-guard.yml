name: notify-example-guard

on:
  workflow_run:
    workflows: ["citest-npu"]
    types: [completed]
  push:
    branches:
      - main
    paths:
      - 'examples/**'

jobs:
  notify:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to example guard
        env:
          TOKEN: ${{ secrets.EXAMPLE_GUARD_PAT }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_RUN_ID: ${{ github.event.workflow_run.id }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "EXAMPLE_GUARD_PAT is not configured"
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ]; then
            event_type="ms-swift-examples-changed"
            sha="$PUSH_SHA"
            payload="$(jq -n \
              --arg sha "$sha" \
              '{
                event_type: "ms-swift-examples-changed",
                client_payload: {
                  repo: "cosdt-ci-test/ms-swift",
                  sha: $sha
                }
              }')"
          else
            event_type="ms-swift-ci-completed"
            sha="$WR_SHA"
            payload="$(jq -n \
              --arg sha "$sha" \
              --argjson run_id "$WR_RUN_ID" \
              --arg conclusion "$WR_CONCLUSION" \
              '{
                event_type: "ms-swift-ci-completed",
                client_payload: {
                  repo: "cosdt-ci-test/ms-swift",
                  sha: $sha,
                  run_id: $run_id,
                  conclusion: $conclusion
                }
              }')"
          fi
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/cosdt-ci-test/workflows/dispatches \
            -d "$payload"
          echo "dispatched $event_type for $sha"
