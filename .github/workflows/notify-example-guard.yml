name: notify-example-guard

on:
  workflow_run:
    workflows: ["citest-npu"]
    types: [completed]

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch ms-swift-ci-completed
        env:
          TOKEN: ${{ secrets.EXAMPLE_GUARD_PAT }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "EXAMPLE_GUARD_PAT is not configured"
            exit 1
          fi
          payload="$(jq -n \
            --arg sha "$SHA" \
            --argjson run_id "$RUN_ID" \
            --arg conclusion "$CONCLUSION" \
            '{
              event_type: "ms-swift-ci-completed",
              client_payload: {
                repo: "cosdt-ci-test/ms-swift",
                sha: $sha,
                run_id: $run_id,
                conclusion: $conclusion
              }
            }')"
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/cosdt-ci-test/workflows/dispatches \
            -d "$payload"
          echo "dispatched ms-swift-ci-completed for $SHA"
