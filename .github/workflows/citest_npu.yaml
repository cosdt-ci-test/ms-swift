name: citest-npu

# Disabled on 2026-08-14.
# Replaced by .github/workflows/quick-start-ascend-ci.yml, which owns all
# Ascend NPU doc-test work. Keep this file so that any external
# branch-protection / required-check references still resolve to a real
# workflow, but the trigger list is empty so it never runs.

on: []

concurrency:
  group: citest-npu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: [linux-aarch64-a2-1]
    if: ${{ false }}
    steps:
      - run: echo "citest-npu is disabled"
