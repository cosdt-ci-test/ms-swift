name: Ascend Quick Start (NPU)

# Single workflow that handles the Ascend Quick Start doc test:
#   1. Every hour: lightweight monitor (hash doc / release / commit).
#   2. If any of those change, install ms-swift from the new commit
#      and run the e2e test on the NPU runner.
#   3. If nothing changed, exit after the monitor.
#
# The first three steps run on every trigger and finish in seconds
# (curl + sha256). The last two steps only run when the monitor
# reports a change, so the NPU runner is only used when there is
# something to verify.

concurrency:
  group: quick-start-ascend-ci
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_install:
        description: 'force the install + test steps to run (skip the monitor check)'
        type: boolean
        default: false
      upstream_repo:
        description: 'override the upstream repo to test'
        required: false
        default: ''
      upstream_ref:
        description: 'override the upstream ref to test'
        required: false
        default: 'main'

permissions:
  contents: read

env:
  UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO || inputs.upstream_repo || 'modelscope/ms-swift' }}
  UPSTREAM_REF_DEFAULT: ${{ inputs.upstream_ref || 'main' }}
  MONITORED_DOC_URL: ${{ vars.MONITORED_DOC_URL || format('https://raw.githubusercontent.com/{0}/main/docs/source/GetStarted/Quick-start-Ascend.md', env.UPSTREAM_REPO) }}
  GH_API: https://api.github.com

jobs:
  monitor-and-test:
    name: monitor + (test on change)
    runs-on: [linux-aarch64-a2-1]
    timeout-minutes: 120
    container:
      image: 'swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:8.3.rc2-910b-ubuntu22.04-py3.11'
      options: >-
        --privileged
        --device=/dev/davinci0
        --device=/dev/davinci1
        --device=/dev/davinci2
        --device=/dev/davinci3
        --device=/dev/davinci_manager
        --device=/dev/devmm_svm
        --device=/dev/hisi_hdc
        --volume=/usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
        --volume=/usr/local/sbin/npu-smi:/usr/local/sbin/npu-smi:ro
        --volume=/etc/ascend_install.info:/etc/ascend_install.info:ro
    env:
      UV_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      UV_EXTRA_INDEX_URL: "https://repo.huaweicloud.com/ascend/repos/pypi"
      UV_INDEX_STRATEGY: "unsafe-best-match"
      UV_INSECURE_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"
      UV_HTTP_TIMEOUT: "120"
      UV_NO_CACHE: "1"
      UV_SYSTEM_PYTHON: "1"
      PIP_INDEX_URL: "http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple"
      PIP_TRUSTED_HOST: "cache-service.nginx-pypi-cache.svc.cluster.local"
    steps:
      - name: 打印上下文
        run: |
          echo "=========================================="
          echo "Trigger:    ${{ github.event_name }}"
          echo "Upstream:   ${{ env.UPSTREAM_REPO }}@${{ env.UPSTREAM_REF_DEFAULT }}"
          echo "Force:      ${{ inputs.force_install || 'false' }}"
          echo "=========================================="

      - name: Config mirrors
        run: |
          sed -Ei 's@(ports|archive).ubuntu.com@cache-service.nginx-pypi-cache.svc.cluster.local:8081@g' /etc/apt/sources.list
          pip config set global.index-url http://cache-service.nginx-pypi-cache.svc.cluster.local/pypi/simple
          pip config set global.trusted-host cache-service.nginx-pypi-cache.svc.cluster.local

      - name: Checkout fork (provides tests/docs/ and test code)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ----- monitor block (always runs) -----
      - name: 监控 doc hash
        id: monitor-doc
        if: inputs.force_install != true
        env:
          DOC_URL: ${{ env.MONITORED_DOC_URL }}
        run: |
          set -euo pipefail
          echo "Monitoring: $DOC_URL"
          NEW=$(curl -fsSL --retry 3 "$DOC_URL" | sha256sum | cut -d' ' -f1)
          OLD=$(cat .doc_hash 2>/dev/null || echo "")
          if [ "$OLD" != "$NEW" ]; then
            echo "$NEW" > .doc_hash
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "reason=doc" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "doc_hash=$NEW"

      - name: 监控 upstream latest release SHA
        id: monitor-release
        if: inputs.force_install != true
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            "$GH_API/repos/${{ env.UPSTREAM_REPO }}/releases/latest" -o /tmp/release.json
          TAG=$(jq -r '.tag_name // empty' /tmp/release.json)
          SHA=$(jq -r '.target_commitish // empty' /tmp/release.json)
          OLD=$(cat .last_release_sha 2>/dev/null || echo "")
          if [ -n "$SHA" ] && [ "$OLD" != "$SHA" ]; then
            echo "$SHA" > .last_release_sha
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
            echo "reason=release" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "release_tag=$TAG release_sha=$SHA"

      - name: 监控 upstream main HEAD
        id: monitor-commit
        if: inputs.force_install != true
        run: |
          set -euo pipefail
          SHA=$(curl -fsSL --retry 3 \
            "$GH_API/repos/${{ env.UPSTREAM_REPO }}/commits/main" | jq -r '.sha // empty')
          OLD=$(cat .last_tested_sha 2>/dev/null || echo "")
          if [ -n "$SHA" ] && [ "$OLD" != "$SHA" ]; then
            echo "$SHA" > .last_tested_sha
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "reason=commit" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "main_sha=$SHA"

      # ----- aggregate decision -----
      - name: 决定是否要跑测试
        id: decide
        if: inputs.force_install != true
        run: |
          CHANGED="false"
          REASON=""
          REF="${{ env.UPSTREAM_REF_DEFAULT }}"
          if [ "${{ steps.monitor-doc.outputs.changed }}" = "true" ]; then
            CHANGED="true"
            REASON="doc"
            REF="${{ steps.monitor-doc.outputs.ref }}"
          elif [ "${{ steps.monitor-release.outputs.changed }}" = "true" ]; then
            CHANGED="true"
            REASON="release"
            REF="${{ steps.monitor-release.outputs.ref }}"
          elif [ "${{ steps.monitor-commit.outputs.changed }}" = "true" ]; then
            CHANGED="true"
            REASON="commit"
            REF="${{ steps.monitor-commit.outputs.ref }}"
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          if [ "$CHANGED" != "true" ]; then
            echo "No upstream changes — skipping install + test"
          fi

      # ----- test block (only when something changed) -----
      - name: Resolve upstream commit SHA
        id: upstream-commit
        if: |
          inputs.force_install == true ||
          steps.decide.outputs.changed == 'true'
        run: |
          set -euo pipefail
          SHA=$(curl -fsSL "$GH_API/repos/${{ env.UPSTREAM_REPO }}/commits/${{ steps.decide.outputs.ref }}" \
            | jq -r '.sha // empty')
          [ -z "$SHA" ] && { echo "failed to resolve ${{ steps.decide.outputs.ref }}"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Upstream commit: $SHA"

      - name: 装 ms-swift 并跑 quick start 测试
        id: test
        if: |
          inputs.force_install == true ||
          steps.decide.outputs.changed == 'true'
        env:
          SWIFT_NPU_E2E: '1'
          UPSTREAM_REPO: ${{ env.UPSTREAM_REPO }}
          UPSTREAM_REF: ${{ steps.decide.outputs.ref || env.UPSTREAM_REF_DEFAULT }}
          UPSTREAM_COMMIT: ${{ steps.upstream-commit.outputs.sha }}
          REASON: ${{ steps.decide.outputs.reason || 'manual' }}
        run: |
          python -m unittest tests.docs.test_quick_start_ascend -v 2>&1 | tee /tmp/unittest.log

      - name: 汇总测试结果
        if: always()
        env:
          UPSTREAM_COMMIT: ${{ steps.upstream-commit.outputs.sha }}
          REASON: ${{ steps.decide.outputs.reason || 'manual' }}
        run: |
          echo "============================================================"
          echo "QUICK START TEST SUMMARY"
          echo "  Upstream repo:    ${{ env.UPSTREAM_REPO }}"
          echo "  Upstream ref:     ${{ steps.decide.outputs.ref || env.UPSTREAM_REF_DEFAULT }}"
          echo "  Upstream commit:  ${{ steps.upstream-commit.outputs.sha }}"
          echo "  Trigger reason:   ${{ steps.decide.outputs.reason || 'manual' }}"
          echo "------------------------------------------------------------"
          if [ -f /tmp/unittest.log ]; then
            grep -E '^Ran [0-9]+ test' /tmp/unittest.log | tail -n 1 || true
            grep -E '^(OK|FAILED)' /tmp/unittest.log | tail -n 1 || true
          fi
          echo "============================================================"
